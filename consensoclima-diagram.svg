<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Flujo de ConsensoClima v1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <style>
      .t  { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .s  { font: 11px Consolas, 'Courier New', monospace; fill: #8b949e; }
      .h  { font: 700 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9b8ff; }
      .hs { font: 12px Consolas, 'Courier New', monospace; fill: #8b949e; }
      .box { fill: #161b22; stroke: #512BD4; stroke-width: 1.5; }
      .core { fill: #1c1433; stroke: #a78bfa; stroke-width: 2; }
      .okb { fill: #161b22; stroke: #3fb950; stroke-width: 1.5; }
      .bad { fill: #161b22; stroke: #f85149; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="328" rx="14" fill="#0d1117" stroke="#30363d"/>

  <text x="30" y="40" class="h">ConsensoClima · flujo v1</text>
  <text x="870" y="40" class="hs" text-anchor="end">fan-out concurrente → consolidación → confianza</text>

  <!-- Ciudades -->
  <rect x="30" y="146" width="130" height="60" rx="10" class="box"/>
  <text x="95" y="172" class="t" text-anchor="middle">Ciudades</text>
  <text x="95" y="191" class="s" text-anchor="middle">appsettings.json</text>

  <line x1="160" y1="176" x2="193" y2="176" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>

  <!-- Agregador -->
  <rect x="195" y="140" width="150" height="72" rx="10" class="core"/>
  <text x="270" y="168" class="t" text-anchor="middle">Agregador</text>
  <text x="270" y="187" class="s" text-anchor="middle">Task.WhenAll</text>
  <text x="270" y="202" class="s" text-anchor="middle">CancellationToken</text>

  <!-- fan-out -->
  <path d="M345,176 C365,176 365,103 383,103" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
  <line x1="345" y1="176" x2="383" y2="176" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
  <path d="M345,176 C365,176 365,249 383,249" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>

  <!-- Proveedores -->
  <rect x="385" y="80" width="175" height="46" rx="10" class="okb"/>
  <text x="472" y="100" class="t" text-anchor="middle">Open-Meteo</text>
  <text x="472" y="116" class="s" text-anchor="middle">IProveedorClima</text>

  <rect x="385" y="153" width="175" height="46" rx="10" class="okb"/>
  <text x="472" y="173" class="t" text-anchor="middle">OpenWeatherMap</text>
  <text x="472" y="189" class="s" text-anchor="middle">IProveedorClima</text>

  <rect x="385" y="226" width="175" height="46" rx="10" class="bad"/>
  <text x="472" y="246" class="t" text-anchor="middle">WeatherAPI</text>
  <text x="472" y="262" class="s" text-anchor="middle" style="fill:#f85149">timeout → aislado</text>

  <!-- fan-in -->
  <path d="M560,103 C580,103 580,176 598,176" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#ok)"/>
  <line x1="560" y1="176" x2="598" y2="176" stroke="#3fb950" stroke-width="2" marker-end="url(#ok)"/>
  <path d="M560,249 C580,249 580,200 590,190" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="583" y="198" style="font: 700 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill:#f85149">✕</text>

  <!-- Consolidación -->
  <rect x="600" y="140" width="150" height="72" rx="10" class="core"/>
  <text x="675" y="168" class="t" text-anchor="middle">Consolidación</text>
  <text x="675" y="187" class="s" text-anchor="middle">LINQ</text>
  <text x="675" y="202" class="s" text-anchor="middle">avg · rango · acuerdo</text>

  <line x1="750" y1="176" x2="768" y2="176" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>

  <!-- Reporte -->
  <rect x="770" y="146" width="105" height="60" rx="10" class="box"/>
  <text x="822" y="172" class="t" text-anchor="middle">Reporte</text>
  <text x="822" y="191" class="s" text-anchor="middle">+ confianza</text>

  <!-- Leyenda -->
  <line x1="30" y1="303" x2="60" y2="303" stroke="#3fb950" stroke-width="2"/>
  <text x="68" y="307" class="s">fuente respondió</text>
  <line x1="200" y1="303" x2="230" y2="303" stroke="#f85149" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="238" y="307" class="s">fuente falló o tardó: se reporta, no tumba la corrida</text>
</svg>
